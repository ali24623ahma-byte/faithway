name: faithway
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  onesignal_flutter: ^5.2.6
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  adhan: ^2.0.0+1
  flutter_qiblah: ^3.1.0+1
  geolocator: ^13.0.4
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.14
  flutter_compass_v2: ^1.0.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  permission_handler: ^12.0.1
  flutter_ringtone_player: ^4.0.0+4
  android_alarm_manager_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/mosque_background.png
    - assets/icons/
    - assets/prayer_rakat.png
    - assets/location_icon.png
    - assets/save_icon.png
    - assets/quran.png
    - assets/logo.png
    - assets/qibla_needle.png
    - assets/compass.png
    - assets/qibla_location.png
    - assets/azan.wav
    - assets/splash.png
    - assets/kaaba_icon.png
    - assets/profile_dummy.png
    - assets/splash_logo.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true

